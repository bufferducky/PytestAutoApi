name: pytestautoapi
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pyta_platform}
      MYSQL_USER: ${MYSQL_USER:-pyta_platform}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1 -u "$${MYSQL_USER}" "$${MYSQL_DATABASE}" -e "SELECT 1" >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
  backend:
    image: pytestautoapi-backend:${RELEASE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        INSTALL_WEB_RUNNER: ${INSTALL_WEB_RUNNER:-1}
    restart: unless-stopped
    environment:
      PLATFORM_BACKEND_APP_ENV: production
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-pyta_platform}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pyta_platform}
      PLATFORM_BACKEND_ARTIFACT_ROOT: /state/artifacts
      PYTA_SECRET_YANJI_TEST_USER: ${PYTA_SECRET_YANJI_TEST_USER:-}
      PYTA_SECRET_YANJI_TEST_PASSWORD_DIGEST: ${PYTA_SECRET_YANJI_TEST_PASSWORD_DIGEST:-}
      PYTA_SECRET_YANJI_WEB_USER: ${PYTA_SECRET_YANJI_WEB_USER:-}
      PYTA_SECRET_YANJI_WEB_PASSWORD: ${PYTA_SECRET_YANJI_WEB_PASSWORD:-}
      PYTA_BUSINESS_DATASOURCES_JSON: ${PYTA_BUSINESS_DATASOURCES_JSON:-[]}
      PYTA_SECRET_YANJI_DB_USER: ${PYTA_SECRET_YANJI_DB_USER:-}
      PYTA_SECRET_YANJI_DB_PASSWORD: ${PYTA_SECRET_YANJI_DB_PASSWORD:-}
      PYTA_SECRET_YANJI_RECEPTION_USER: ${PYTA_SECRET_YANJI_RECEPTION_USER:-}
      PYTA_SECRET_YANJI_RECEPTION_PASSWORD: ${PYTA_SECRET_YANJI_RECEPTION_PASSWORD:-}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - platform-data:/state
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    stop_grace_period: 60s
  web:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-18080}:80"
    volumes:
      - ../platform/frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      backend:
        condition: service_healthy
volumes:
  platform-data:
  mysql-data:
