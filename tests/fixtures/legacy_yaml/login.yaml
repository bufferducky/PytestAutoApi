  allureFeature: 登录
  allureStory: 合成输入
login_01:
  host: ${{host()}}
  url: /api/login
  method: POST
  detail: 正常登录
  headers:
    Content-Type: application/json
  requestType: json
  is_run: null
  data:
    username: synthetic-user
    password: synthetic-secret
  dependence_case: false
  assert:
    code:
      jsonpath: $.code
      type: ==
      value: 200
      AssertType: null
